# Render deployment config for GitHub MCP Server
# https://github.com/github/github-mcp-server
#
# Deploy steps:
#   1. Connect this repo to Render (New → Web Service → connect repo)
#   2. Set GITHUB_PERSONAL_ACCESS_TOKEN in Render dashboard → Environment
#   3. Deploy

services:
  - type: web
    name: github-mcp-server
    runtime: image
    image:
      url: ghcr.io/github/github-mcp-server:v0.33.1

    # Override the default CMD (stdio) to run in HTTP server mode.
    # The binary ENTRYPOINT is /server/github-mcp-server; this supplies the args.
    # Render injects $PORT at runtime — the server binds to whatever port Render assigns.
    startCommand: /server/github-mcp-server http --port $PORT

    # Starter is the lowest always-on plan (~$7/month as of writing).
    # The free plan exists but web services sleep after inactivity, making
    # Claude.ai connections unreliable. Verify current pricing at render.com/pricing.
    plan: starter

    # Render checks this path periodically to confirm the service is alive.
    # The server registers a GET /.well-known/oauth-protected-resource endpoint
    # via its OAuth handler, which reliably returns 200 for health checks.
    healthCheckPath: /.well-known/oauth-protected-resource

    envVars:
      # Required: your GitHub Personal Access Token.
      # Set the value in the Render dashboard → Environment → Add Secret.
      # Do NOT commit the real token to this file.
      - key: GITHUB_PERSONAL_ACCESS_TOKEN
        sync: false
